apiVersion: apps/v1
kind: Deployment

metadata:
  name: storage-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          volumeMounts:
            - name: app-storage
              mountPath: /usr/share/nginx/html/data

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: demo-pvc
