apiVersion: apps/v1
kind: Deployment

metadata:
  name: configmap-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: configmap-demo

  template:
    metadata:
      labels:
        app: configmap-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          envFrom:
            - configMapRef:
                name: app-config
