apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: lab-18
  labels:
    app: frontend
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: lab-18
  labels:
    app: backend
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
