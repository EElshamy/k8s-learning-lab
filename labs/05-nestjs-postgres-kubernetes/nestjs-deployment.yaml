apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-postgres-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nestjs-postgres-app
  template:
    metadata:
      labels:
        app: nestjs-postgres-app
    spec:
      containers:
        - name: nestjs
          image: nestjs-postgres-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nestjs-config
            - secretRef:
                name: nestjs-secret
