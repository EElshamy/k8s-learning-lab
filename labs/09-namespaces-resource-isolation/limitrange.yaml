apiVersion: v1
kind: LimitRange
metadata:
  name: lab-09-limits
  namespace: lab-09
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "64Mi"
      default:
        cpu: "250m"
        memory: "128Mi"
      min:
        cpu: "50m"
        memory: "32Mi"
      max:
        cpu: "500m"
        memory: "256Mi"
