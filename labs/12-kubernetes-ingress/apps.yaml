apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: lab-12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-content
          configMap:
            name: app1-content
---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: lab-12
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
---
