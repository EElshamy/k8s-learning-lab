apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: memory-eater
      image: polinux/stress
      command: ["stress"]
      args:
        - "--vm"
        - "1"
        - "--vm-bytes"
        - "50M"
        - "--vm-hang"
        - "0"
      resources:
        requests:
          memory: "10Mi"
        limits:
          memory: "100Mi"
