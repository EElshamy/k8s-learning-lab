apiVersion: apps/v1
kind: Deployment

metadata:
  name: nestjs-k8s-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nestjs-k8s-app

  template:
    metadata:
      labels:
        app: nestjs-k8s-app

    spec:
      containers:
        - name: nestjs
          image: nestjs-k8s-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
